spring.application.name=proxymed-suivi-test

# H2 en mode compatibilite PostgreSQL : les tests tournent sans Postgres.
# Le schema (Liquibase) et le mapping JPA restent identiques a la prod ; seul le
# moteur SQL change.
spring.datasource.url=jdbc:h2:mem:proxymed_suivi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Liquibase reste la seule source de verite du schema en test comme en prod.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelogs/changelog-master.yaml

# Les tests d'integration partent de tables vides : on n'active pas le contexte des donnees
# de depart (test-data), seuls les changesets de schema (sans contexte) s'executent.
spring.liquibase.contexts=tests

spring.jackson.deserialization.fail-on-unknown-properties=true

# Faux secret, propre aux tests : FabriqueBadge s'en sert pour signer les badges de test.
jwt.secret=secret-de-test-proxymed-suivi-au-moins-32-octets-0123456789
jwt.emetteur=proxymed-auth

proxymed.cors.origines=http://localhost:4200
