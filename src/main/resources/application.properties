spring.application.name=proxymed-suivi

# 8080 est pris par un autre projet, 8081 par PROXYMED 1 (Fiche 1).
server.port=8082

# Base existante "proxymed-suivi" sur le PostgreSQL local (meme serveur et meme role que PROXYMED 1).
spring.datasource.url=jdbc:postgresql://localhost:5432/proxymed-suivi
spring.datasource.username=proxymed
spring.datasource.password=proxymed
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelogs/changelog-master.yaml

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.jackson.deserialization.fail-on-unknown-properties=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
