spring.application.name=proxymed-suivi

# Secrets (acces a la base, secret du badge) : jamais dans ce fichier. Ils viennent des
# variables d'environnement, ou du fichier local .env.properties a la racine du projet s'il existe
# (ignore par Git ; modele : .env.properties.example).
# Une vraie variable d'environnement l'emporte sur .env.properties.
spring.config.import=optional:file:./.env.properties

# 8080 est pris par un autre projet, 8081 par PROXYMED 1 (Fiche 1).
server.port=8082

# Base existante "proxymed-suivi" sur le PostgreSQL local (meme serveur et meme role que PROXYMED 1).
spring.datasource.url=jdbc:postgresql://localhost:5432/proxymed-suivi
spring.datasource.username=${PROXYMED_DB_USERNAME}
spring.datasource.password=${PROXYMED_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelogs/changelog-master.yaml

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.jackson.deserialization.fail-on-unknown-properties=true

spring.servlet.multipart.max-file-size=10MB
# La requete multipart contient, en plus du fichier, ses en-tetes : marge de 1 Mo pour qu'un
# PDF de 10 Mo tout juste passe. La limite metier (10 Mo) est aussi verifiee par FicheSigneeService.
spring.servlet.multipart.max-request-size=11MB

# Badge (JWT) delivre par le service d'authentification et seulement verifie ici (HS256).
# Meme secret et meme emetteur que proxymed-auth ; aucune valeur par defaut pour le secret.
jwt.secret=${PROXYMED_JWT_SECRET}
jwt.emetteur=proxymed-auth

# CORS : origines du front autorisees a appeler ce service, separees par des virgules.
# Par defaut le front Angular de developpement.
proxymed.cors.origines=${PROXYMED_CORS_ORIGINS:http://localhost:4200}
